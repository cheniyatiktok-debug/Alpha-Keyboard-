name: Build Alpha Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o alpha-keyboard-source.zip -d extracted

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/Alpha-Keyboard.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Keyboard-APK
          path: Alpha-Keyboard.apk
